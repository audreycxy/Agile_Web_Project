services:
  - type: web
    name: clicking-game
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --listen=0.0.0.0:$PORT wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE
        value: instance/app.db
      - key: AUTO_MIGRATE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.7"
