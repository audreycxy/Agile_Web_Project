<!--
  Shared base layout. Page templates extend this and fill in the blocks
  defined below, so they don't have to repeat <!doctype>, <html>, <head>,
  Bootstrap CSS, Google Fonts, style.css, and the Bootstrap JS bundle.
-->
<!doctype html>
<html lang="en">
  <head>
    <!-- Basic page metadata -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Optional CSRF meta tag for pages using AJAX/form protection -->
    {% block csrf_meta %}{% endblock %}

    <!-- Page title -->
    <title>{% block title %}Egg Clicker{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Shared project stylesheet -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <!-- Optional page-specific CSS or extra head content -->
    {% block extra_head %}{% endblock %}
  </head>

  <body class="{% block body_class %}{% endblock %}">
    <!-- Page-specific navigation bar -->
    {% block navbar %}{% endblock %}

    <!-- Main page content -->
    {% block content %}{% endblock %}

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Prevent unwanted mobile double-tap zoom on rapid-tap game controls. Loaded 
         here so it covers every page, including the home-page demo egg and the 
         in-game egg button. See the file for the iOS-specific details. -->
    <script src="{{ url_for('static', filename='js/prevent_mobile_zoom.js') }}"></script>

    <!-- Optional page-specific JavaScript -->
    {% block scripts %}{% endblock %}
  </body>
</html>
