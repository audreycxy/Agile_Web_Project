<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- Link the shared stylesheet from the static/css folder -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <div
      class="container min-vh-100 d-flex align-items-center justify-content-center"
    >
      <div
        class="card shadow-sm border-0"
        style="max-width: 420px; width: 100%"
      >
        <div class="card-body p-4">
          <h2 class="text-center mb-4">Login</h2>

          {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
          {% endif %}

          <form
            id="loginForm"
            method="POST"
            action="{{ url_for('auth.login') }}"
          >
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

            <div class="mb-3">
              <input
                id="email"
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required
              />
            </div>
            <div class="mb-3">
              <input
                id="password"
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                required
              />
            </div>
            <p id="message" class="text-danger mb-3"></p>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>

          <p class="text-center mt-3 mb-2">
            Don't have an account?
            <a href="{{ url_for('auth.signup') }}">Sign up here</a>
          </p>

          <div class="d-grid">
            <a href="{{ url_for('main.guest') }}" class="btn btn-secondary"
              >Continue as Guest Player</a
            >
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
  </body>
</html>
