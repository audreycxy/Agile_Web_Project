<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Clicker Game</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>

    <body class="bg-light">
        <div class="container-fluid vh-100 d-flex flex-column px-0">
            <div class="row g-0 flex-grow-1 overflow-hidden">
                <!-- Upgrades (Left Panel) -->
                <div class="col-12 col-md-3 order-2 order-md-1 d-flex flex-column border-end bg-white">
                    <div class="card shadow-sm flex-grow-1 mb-0">
                        <div class="p-3 border-bottom bg-light">Upgrades</div>
                        <div class="card-body d-flex flex-column p-0" id="upgrade-panel" style="overflow: hidden;">
                            <div class="flex-grow-1 overflow-auto p-3">
                                <button id="upgrade-btn" class="btn btn-outline-success w-100 mb-2 py-3">
                                    Auto-Clicker <br> <small>(Cost: 10)</small>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Game (Middle Panel) -->
                <div class="col-12 col-lg-6 order-1 order-lg-2">
                    <div class="card shadow h-100 p-5 border-primary mb-4">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">
                            <h1 class="display-2 fw-bold" id="egg-count">0</h1>
                            <p class="text-muted">Eggs Collected</p>
                            
                            <button id="egg-btn" class="btn btn-primary rounded-circle shadow my-4 d-block mx-auto" style="width: 250px; height: 250px; font-size: 1.5rem; font-weight: bold;">
                            CLICK!
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Leaderboard (Right Panel) -->
                <div class="col-12 col-lg-3 order-3">
                    <div class="card h-100 shadow-sm mb-4">
                        <div class="card-header bg-dark text-white fw-bold">Leaderboard</div>
                        <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between">
                            <span>1. PlayerOne</span>
                            <span class="badge bg-primary rounded-pill">1.2M</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>2. ClickMaster</span>
                            <span class="badge bg-secondary rounded-pill">900k</span>
                        </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
