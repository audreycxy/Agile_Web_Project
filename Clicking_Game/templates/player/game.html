<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Clicker Game</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

        <style>
            #egg-btn {
                transition: transform 0.1s;
            }

            #egg-btn:hover {
                transform: scale(1.05);
            }

            #egg-btn:active {
                transform: scale(0.95);
            }
        </style>
    </head>

    <body class="bg-light">
        <nav class="navbar navbar-dark bg-dark sticky-top mb-3">
            <div class="container-fluid">
                <a class="navbar-brand nav-click-anim" href="{{ url_for('main.home') }}">
                Home
                </a>
                <div class="navbar-nav ms-auto">
                    <a class="btn btn-outline-light btn-sm nav-click-anim" href="{{ url_for('auth.login') }}">
                    Log In
                    </a>
                </div>
            </div>
        </nav>

        <!-- Loading Screen for the game area while it loads -->
        <div id="loading-overlay">
            <p>Loading your save...</p>
        </div>

        <!-- Game Screen: hidden until the scripts are loaded -->
        <div id="game-screen" class="container-fluid vh-100 d-flex flex-column px-0" style="display: none !important;">
            <div class="row g-0 flex-grow-1 overflow-hidden">
                <!-- Upgrades (Left Panel) -->
                <div class="col-12 col-md-3 order-2 order-md-1 d-flex flex-column border-end bg-white">
                    <div class="card shadow-sm flex-grow-1 mb-0">
                        <div class="p-3 border-bottom bg-light">Upgrades</div>
                        <div class="card-body d-flex flex-column p-0" id="upgrade-panel" style="overflow: hidden;">
                            <div class="flex-grow-1 overflow-auto p-3">
                                <button id="upgrade-btn" class="btn btn-outline-success w-100 mb-2 py-3">
                                    Auto-Clicker <br> <small>(Cost: 10)</small>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Game (Middle Panel) -->
                <div class="col-12 col-lg-6 order-1 order-lg-2">
                    <div class="h-100 p-5 mb-4 d-flex flex-column align-items-center text-center">
                        <!-- Progress Bar & Clicks Left -->
                        <div class="w-100 pt-3">
                            <div id="progress-container" class="mx-auto" style="width: 80%; max-width: 400px; height: 20px; background: #dee2e6; border-radius: 10px; overflow: hidden; border: 1px solid #ced4da;">
                                <div id="progress-bar" style="width: {{ state.progress_percent }}%; height: 100%; background: #28a745; transition: width 0.2s ease;"></div>
                            </div>
                            <p id="click-count" class="text-muted">{{ state.clicks_remaining }}</p>
                        </div>

                        <!-- Game Content (Middle - Egg & Points)-->
                        <div class="mt-auto mb-auto">
                            <h1 class="display-2 fw-bold" id="egg-points">{{ state.points }}</h1>
                            <p class="text-muted">Points</p>
                            
                            <button id="egg-btn"
                                    class="btn d-block mx-auto border-0 p-0"
                                    style="width: 250px; height: 250px; 
                                            background-image: url('../static/images/defaultegg_nobackground.png'); 
                                            background-size: contain; 
                                            background-repeat: no-repeat; 
                                            background-position: center; 
                                            background-color: transparent; 
                                            image-rendering: pixelated; 
                                            text-indent: -9999px;
                                            outline: none;
                                            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.2));">
                            CLICK!
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Leaderboard (Right Panel) -->
                <div class="col-12 col-lg-3 order-3">
                    <div class="card h-100 shadow-sm mb-4">
                        <div class="card-header bg-dark text-white fw-bold">Leaderboard</div>
                        <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between">
                            <span>1. PlayerOne</span>
                            <span class="badge bg-primary rounded-pill">1.2M</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>2. ClickMaster</span>
                            <span class="badge bg-secondary rounded-pill">900k</span>
                        </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <script>
            const INITIAL_STATE = JSON.parse('{{ state | tojson | safe }}');
        </script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{{ url_for('static', filename='js/game.js') }}"></script>
    </body>
</html>
