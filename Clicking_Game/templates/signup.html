<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>

  <!-- Link the shared stylesheet from the static/css folder -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm border-0" style="max-width: 460px; width: 100%;">
      <div class="card-body p-4">
        <h2 class="text-center mb-4">Sign Up</h2>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form id="signupForm" method="POST" action="{{ url_for('auth.signup') }}">
          <div class="mb-3">
            <input id="username" type="text" name="username" class="form-control" placeholder="Enter your username" required>
          </div>
          <div class="mb-3">
            <input id="email" type="email" name="email" class="form-control" placeholder="Enter your email" required>
          </div>
          <div class="mb-3">
            <input id="password" type="password" name="password" class="form-control" placeholder="Enter your password" required>
          </div>
          <div class="mb-3">
            <input id="confirmPassword" type="password" name="confirm_password" class="form-control" placeholder="Confirm your password"
              required>
          </div>
          <p id="message" class="text-danger mb-3"></p>
          <button type="submit" class="btn btn-success w-100">Sign Up</button>
        </form>

        <p class="text-center mt-3 mb-0">
          Already have an account?
          <a href="{{ url_for('auth.login') }}">Login here</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="{{ url_for('static', filename='js/signup.js') }}"></script>
</body>

</html>
