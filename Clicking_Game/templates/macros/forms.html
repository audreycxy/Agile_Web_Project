{% macro password_field(field_id, name, label, placeholder='', required=False, value='', wrapper_class='mb-3') -%}
<div class="{{ wrapper_class }}">
  <label for="{{ field_id }}" class="auth-label">{{ label }}</label>

  <div class="password-toggle-wrap">
    <input
      type="password"
      class="form-control auth-input"
      id="{{ field_id }}"
      name="{{ name }}"
      placeholder="{{ placeholder }}"
      {% if value %}value="{{ value }}"{% endif %}
      {% if required %}required{% endif %}
    />

    <button
      type="button"
      class="password-toggle-btn"
      data-target="{{ field_id }}"
      aria-pressed="false"
    >
      Show
    </button>
  </div>
</div>
{%- endmacro %}

{% macro dropdown_action_form(action, field_name, field_value, label) -%}
<form method="post" action="{{ action }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <input type="hidden" name="{{ field_name }}" value="{{ field_value }}" />
  <button type="submit" class="dropdown-item">{{ label }}</button>
</form>
{%- endmacro %}
